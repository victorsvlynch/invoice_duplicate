[theme]
primaryColor = "#1F497D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FA"
textColor = "#262730"
font = "sans serif"

[server]
port = 8504
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 250

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
