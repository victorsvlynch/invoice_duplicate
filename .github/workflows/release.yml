name: Release Automático (SemVer)

on:
  push:
    branches:
      - main # Cambia esto si tu rama principal tiene otro nombre (ej. master)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para crear tags y releases

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Bumping version and push tag (Generar Tag Automático)
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Incremento por defecto si no hay prefijos claros
          release_branches: main
          # Esto usa Semantic Versioning leyendo los prefijos de tus commits.

      - name: Crear GitHub Release con Descripción Automática
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
