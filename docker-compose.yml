services:
  invoice-verifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-duplicate-verifier
    restart: unless-stopped
    ports:
      - "8504:8504"
    volumes:
      # Map host data directory to container data directory for easy Excel syncing
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8504
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

